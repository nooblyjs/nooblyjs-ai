<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moonlander</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg id="game" viewBox="0 0 1000 600" role="img" aria-label="Moon lander game">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#02030a"/>
        <stop offset="1" stop-color="#0b1026"/>
      </linearGradient>
      <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9a9a9a"/>
        <stop offset="1" stop-color="#3a3a3a"/>
      </linearGradient>
      <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffe27a"/>
        <stop offset="0.5" stop-color="#d4a017"/>
        <stop offset="1" stop-color="#8a6508"/>
      </linearGradient>
      <radialGradient id="flameGlow">
        <stop offset="0" stop-color="#fff6c0"/>
        <stop offset="0.5" stop-color="#ffb030"/>
        <stop offset="1" stop-color="#ff4000" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="1000" height="600" fill="url(#sky)"/>
    <g id="stars"></g>
    <!-- Earth in the sky, for atmosphere -->
    <g transform="translate(880 80)">
      <circle r="26" fill="#1e5fbf"/>
      <path d="M-14 -12 q10 -6 16 4 q-4 8 -12 6 z M4 6 q10 -2 14 6 q-8 8 -16 2 z" fill="#3c9b4a"/>
      <circle r="26" fill="none" stroke="#9cd0ff" stroke-opacity="0.5" stroke-width="2"/>
    </g>

    <path id="terrain" fill="url(#ground)" stroke="#d0d0d0" stroke-width="1.5"/>
    <g id="platforms"></g>

    <!-- The lander, drawn in pixels around its centre (y down). game.js moves and rotates this group. -->
    <g id="lander">
      <g id="flame" visibility="hidden">
        <circle cx="0" cy="22" r="10" fill="url(#flameGlow)"/>
        <path id="flameShape" d="M-4 13 L0 34 L4 13 Z" fill="#ffd040" stroke="#ff7a00" stroke-width="1"/>
      </g>
      <!-- legs -->
      <g stroke="#c8c8c8" stroke-width="1.6" fill="none">
        <path d="M-8 4 L-12.8 14.4 M8 4 L12.8 14.4 M-6 8 L-12.8 14.4 M6 8 L12.8 14.4"/>
      </g>
      <path d="M-15.5 14.4 h5.4 M10.1 14.4 h5.4" stroke="#e0e0e0" stroke-width="2.2" stroke-linecap="round"/>
      <!-- engine bell -->
      <path d="M-3 8 L-4.5 13 L4.5 13 L3 8 Z" fill="#555" stroke="#888" stroke-width="0.6"/>
      <!-- descent stage: gold foil -->
      <path d="M-9 0 L-7 -2 L7 -2 L9 0 L9 6 L7 8 L-7 8 L-9 6 Z" fill="url(#foil)" stroke="#6b4e05" stroke-width="0.8"/>
      <path d="M-3 -2 v10 M3 -2 v10" stroke="#a87c0c" stroke-width="0.6"/>
      <!-- ascent stage: grey cabin -->
      <path d="M-7 -2 L-7 -8 L-4 -13 L4 -13 L7 -8 L7 -2 Z" fill="#c9ccd1" stroke="#6d7178" stroke-width="0.8"/>
      <path d="M-4.5 -9 L-2 -11.5 L1 -11.5 L1 -8 Z" fill="#1b2433" stroke="#444" stroke-width="0.5"/>
      <rect x="2.5" y="-7" width="3" height="3" fill="#8d9097"/>
      <!-- antenna -->
      <path d="M4 -13 L6 -16.5" stroke="#ddd" stroke-width="0.8"/>
      <circle cx="6.3" cy="-17" r="1.2" fill="#ddd"/>
    </g>

    <g id="explosion" visibility="hidden">
      <circle r="18" fill="#ff7a00" opacity="0.85"/>
      <circle r="10" fill="#ffd040"/>
      <path d="M0 -30 L5 -12 L22 -22 L12 -6 L30 0 L12 6 L22 22 L5 12 L0 30 L-5 12 L-22 22 L-12 6 L-30 0 L-12 -6 L-22 -22 L-5 -12 Z" fill="#ff4000" opacity="0.6"/>
    </g>

    <!-- Status panel -->
    <g id="hud" font-family="'Courier New', monospace" font-size="14" fill="#9fe8ff">
      <rect x="12" y="12" width="250" height="168" rx="8" fill="#000" fill-opacity="0.55" stroke="#2c6f8a"/>
      <text x="24" y="36">FUEL</text>
      <rect x="80" y="24" width="168" height="14" rx="3" fill="none" stroke="#9fe8ff"/>
      <rect id="fuelBar" x="82" y="26" width="164" height="10" rx="2" fill="#3ddc84"/>
      <text id="fuelText" x="24" y="58"></text>
      <text id="altText" x="24" y="80"></text>
      <text id="vxText" x="24" y="102"></text>
      <text id="vyText" x="24" y="124"></text>
      <text id="angleText" x="24" y="146"></text>
      <text id="padsText" x="24" y="168"></text>
    </g>
    <text id="message" x="500" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#fff"></text>
    <text x="988" y="588" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#6c7a99">← → rotate · SPACE thrust · R restart</text>
  </svg>
  <script type="module" src="game.js"></script>
</body>
</html>
