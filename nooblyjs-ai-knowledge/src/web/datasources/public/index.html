<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datasources - noobly Wiki</title>

    <!-- Embed bootstrap (Teams tab support). MUST be the first script: when the
         app is hosted in a cross-site iframe (?embed=1) it patches fetch/XHR to
         authenticate via a bearer token from the host instead of the
         SameSite-blocked session cookie, and applies the Teams theme. A complete
         no-op on a normal web visit. Loaded before apiConfig.js / app.js so the
         fetch patch is in place before the first API call or 401-redirect. -->
    <script src="js/embed-bootstrap.js"></script>

    <!-- Bootstrap 5 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- CodeMirror for code editing with syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/show-hint.min.css" rel="stylesheet">

    <!-- noobly fonts (styles.css also @imports these; linking them here
         starts the download without waiting for that stylesheet to parse) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Shared noobly theme (copy of noobly/styling/styles.css) -->
    <link href="/css/styles.css?v=20261008a" rel="stylesheet">

    <!-- nooblyjs-core: Bootstrap reconciliation + the UIService shell (core-*) -->
    <link href="/services/css/core.css" rel="stylesheet">

    <!-- Datasources-specific overrides + components (theme bridge, shell re-skin, screens) -->
    <link href="css/datasources.css?v=20261008a" rel="stylesheet">

    <!-- API base URL is derived at runtime from the page origin in js/apiConfig.js
         (loaded first in <body>). It must stay same-origin so the secure session
         cookie is sent over HTTPS — do not hardcode a host/protocol here. -->

</head>
<body>
    <div id="App" style="height: 100vh; overflow: hidden;">
        <!-- Header will be inserted here by UIService -->
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2200;"></div>

    <!-- Scripts -->
    <!-- API Configuration Helper (load first!) -->
    <script src="js/apiConfig.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <!-- CodeMirror for code editing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/javascript-hint.min.js"></script>
    <script src="/services/uiservice/js/index.js"></script>

    <!-- Socket.IO Client for Real-Time Communication -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/core/realtime.js"></script>

    <!-- Filing Service (for FilingUIManager) -->
    <script src="/services/filing/scripts/js/index.js"></script>

    <!-- Settings Service (for SettingsUIManager) -->
    <script src="/services/settings/scripts/js/index.js"></script>

    <!-- Application Scripts -->
    <!-- Core UI Components (Task 7.1) -->
    <script src="js/apiClient.js"></script>

    <!-- KR Datasources UI upgrade — Foundation (icons, API helper, router).
         Defines globals only; the router stays dormant until screens are
         registered and Router.start() is called (cutover step). -->
    <script src="js/icons.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/util.js"></script>
    <script src="js/core/filing.js"></script>
    <script src="js/core/code-editor.js"></script>
    <script src="js/core/router.js"></script>

    <!-- KR Datasources screens — register with Router on load. Inert until
         Router.start() is called at cutover. util.js must load first. -->
    <script src="js/screens/dashboard.js"></script>
    <script src="js/screens/workflows.js"></script>
    <script src="js/screens/workflow-edit.js"></script>
    <script src="js/screens/schedules.js"></script>
    <script src="js/screens/executions.js"></script>
    <script src="js/screens/spaces.js"></script>
    <script src="js/screens/repository.js"></script>
    <script src="js/screens/sources.js"></script>
    <script src="js/screens/needs-review.js"></script>
    <script src="js/screens/agents.js"></script>
    <script src="js/screens/prompts.js"></script>
    <script src="js/screens/connections.js"></script>
    <script src="js/screens/user-activity.js"></script>
    <script src="js/screens/settings.js"></script>

    <!-- Step Editors — reused by the workflow editor screen -->
    <script src="js/stepEditors/transformEditor.js"></script>
    <script src="js/stepEditors/apiEditor.js"></script>
    <script src="js/stepEditors/conditionalEditor.js"></script>
    <script src="js/stepEditors/parallelEditor.js"></script>
    <script src="js/stepEditors/delayEditor.js"></script>
    <script src="js/stepEditors/identityEditor.js"></script>

    <!-- Datasources app bootstrap — UIService shell, auth/RBAC, Router.start -->
    <script src="js/app.js"></script>
</body>
</html>
