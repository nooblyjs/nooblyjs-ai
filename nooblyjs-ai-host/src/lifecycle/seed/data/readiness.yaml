# How long an item may wait on a person before Lifecycle calls it "waiting too long" (product.md §4).
#
# Since Phase 27 the checks each stage needs are in lifecycle.yaml (each stage's `checks`). A stage listed under
# `stages` here is used only when lifecycle.yaml gives that stage no `checks` of its own, as a data folder from before
# Phase 27 does: { key, passed, failed }, worked out by the evaluator its stage's kind has for that key.
waitingTooLongDays: 3
