# Secrets are references only (vault:scope/NAME), never values. Agents and preview environments get staging values;
# production values are never mapped here. Sample references for the PRD-031 story.
secrets:
  - { repo: acme/slots-api, name: REDIS_URL, ref: 'vault:staging/REDIS_URL' }
  - { repo: acme/slots-api, name: KAFKA_BROKERS, ref: 'vault:staging/KAFKA_BROKERS' }
  - { repo: acme/slots-api, name: PLANNER_TOKEN, ref: 'vault:staging/PLANNER_TOKEN' }
  - { repo: acme/web-storefront, name: SLOTS_API_URL, ref: 'vault:staging/SLOTS_API_URL' }
