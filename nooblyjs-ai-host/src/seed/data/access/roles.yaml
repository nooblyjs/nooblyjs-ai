  operations.outcome.decide: approve
  operations.outcome.open-idea: draft
  operations.read: read
  operations.release.ask-deploy: draft
  operations.release.deploy: deploy-production
  operations.release.make: draft
  operations.release.roll-back: deploy-production
  operations.release.rollout: deploy-production
  operations.seed: change-guardrails
  operations.slo.burn: draft
  # Knowledge
  knowledge.answer.act: draft
  knowledge.flag.resolve: approve
