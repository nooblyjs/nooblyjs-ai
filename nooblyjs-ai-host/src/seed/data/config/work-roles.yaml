# The work roles: onboarding copy and the layout of each "For you" home (product.md §5.8). A work role shapes the
# home only; it is never read by a permission check. Rebuilt 2026-10-19 from product.md §5.8.
#
# Each role: key, name, initials, layout (the For you home it gets: product-manager, architect, developer; none shows
# Overview), blurb (role card), promise (step 2), tasks [{ title, detail, where }], leadsWith (what the home leads
# with), agent (the example teammate's id; its name in the copy is swapped for the teammate actually hired), agents
# ("Name · what they do"), tools (step 3), home (where onboarding lands), and firstWeek [{ key, text, short, next,
# done: { type, where: { <payload path>: value } } }]: the first three things, ticked by events (`next` is how the
# Getting started card says it). They name the PRD-031 sample story's items; npm run seed:blank drops them.
# The first-week tasks were rebuilt with the sample story on 2026-10-20 (BUG-006).
common:
  firstWeek:
    - { key: pick-role-and-teams, text: Pick your role and teams, short: Role and teams, next: pick your role and teams, done: { type: profile.onboarded } }
roles:
  - key: product-manager
    name: Product manager
    initials: PM
    layout: product-manager
    blurb: Turn customer signals into specs and get them approved.
    promise: Agents research and draft; you shape the problem and approve what moves on.
    tasks:
      - { title: Shape ideas from signals, detail: Ada Quill clusters signals into ideas with a RICE score., where: Product board }
      - { title: Approve specs, detail: Specs come to you when their readiness checks pass., where: 'Specs, Approvals' }
      - { title: Follow your items to production, detail: See where each item waits and who it waits on., where: Lifecycle }
    leadsWith: [Specs waiting on you, Your items in flight, New signals]
    agent: ada-quill
    agents: Ada Quill · research and spec drafting
    tools: [Jira Cloud, Zendesk]
    home: /
    firstWeek:
      - { key: review-first-spec, text: Review PRD-031 · Same-day delivery slots, short: First spec, next: review your first spec, done: { type: approval.decided, where: { type: spec } } }
      - { key: score-substitutions, text: 'Score the "Smarter substitutions" idea', short: Score an idea, next: score an idea, done: { type: idea.scored, where: { ideaId: IDEA-018 } } }
      - { key: pin-delivery-space, text: Pin the Delivery space in Knowledge, short: Pin a space, next: pin a Knowledge space, done: { type: knowledge.space_pinned } }
  # Phase 17: the Business owner (root product.md §5): a portfolio's outcomes and funding.
  - key: business-owner
    name: Business owner
    initials: BO
    layout: business-owner
    blurb: Own a portfolio's outcomes and its funding.
    promise: Agents draft each business case and estimate its cost from the factory's own history; you decide what is worth doing and watch spend against budget.
    tasks:
      - { title: Decide business cases, detail: An idea is accepted only once its business case is complete., where: 'Product, Approvals' }
      - { title: Watch spend against budget, detail: Agent and cloud spend by value stream against each portfolio's budget., where: Metrics }
      - { title: Shape the work, detail: Portfolio epics, epics and features under your portfolio., where: Product · Portfolios }
    leadsWith: [Business cases waiting, Spend against budget, Epics without a business case]
    agent: ada-quill
    agents: Research agent · business cases and their estimates
    tools: [Jira Cloud]
    home: /
    firstWeek: []
  - key: architect
    name: Architect
    initials: AR
    layout: architect
    blurb: Shape solutions and sign off the decisions that matter.
    promise: The architect agent drafts container views and decisions; you own the trade-offs.
    tasks:
      - { title: Review generated designs, detail: Rhea Voss drafts container views from each approved spec., where: Architecture }
      - { title: Accept or challenge decisions, detail: New dependencies need an ADR you accept., where: 'Decisions, Approvals' }
      - { title: Keep standards current, detail: Standards are checked on every PR., where: Knowledge }
    leadsWith: [Decisions awaiting you, Your Architecture queue, Standards broken on PRs]
    agent: rhea-voss
    agents: Rhea Voss · container views and decisions
    tools: [GitHub, Enterprise Knowledge Repository]
    home: /
    firstWeek:
      - { key: decide-adr-014, text: Accept or challenge ADR-014 · Cache slot availability in Redis, short: First decision, next: decide ADR-014, done: { type: approval.decided, where: { subject: ADR-014 } } }
      - { key: review-container-view, text: Review the container view of PRD-031, short: Container view, next: review a container view, done: { type: architecture.diagram_updated, where: { itemId: PRD-031 } } }
      - { key: give-design-handoff, text: Give your first Design handoff, short: Design handoff, next: give a Design handoff, done: { type: approval.decided, where: { type: design-handoff } } }
  # Lifecycle v3 (Phase 16b, root product.md §5): the Design and Engineer stages' people and the testers. The Solution
  # Architect and Functional Analyst homes came with Phase 16c, the Application Architect and Test analyst homes with
  # 16d; the tester's comes with 16e, and until then onboarding lands on Overview.
  # Phase 18: the Business analyst (root product.md §5): where requirements come from.
  - key: business-analyst
    name: Business analyst
    initials: BA
    layout: business-analyst
    blurb: Find out what people need, and keep every requirement traced to who said it.
    promise: The analyst agent turns your session notes into candidate requirements, each quoting its source; you accept, merge or reject them.
    tasks:
      - { title: Run elicitation sessions, detail: 'Interviews, workshops and Teams meetings, with their notes.', where: Product · Elicitation }
      - { title: Decide candidate requirements, detail: Nothing becomes a requirement without your decision., where: Product · Elicitation }
      - { title: Walk the NFR catalogue, detail: Each category answered or marked not applicable., where: Product · Elicitation }
    leadsWith: [Candidate requirements to decide, Specs with no session, Open questions]
    agent: ada-quill
    agents: Analyst agent · candidate requirements from your notes
    tools: [Jira Cloud, Microsoft Teams]
    home: /
    firstWeek: []
  - key: solution-architect
    name: Solution Architect
    initials: SA
    layout: solution-architect
    blurb: Fit each change into the estate and hand its stories to Engineering.
    promise: Agents draft the feature landscape, impacted systems and NFRs; you own the solution and the Design handoff.
    tasks:
      - { title: Shape the solution architecture, detail: 'Feature landscape, impacted systems and NFRs for each item.', where: Design }
      - { title: Accept or challenge decisions, detail: New dependencies need an ADR you accept., where: 'Architecture, Approvals' }
      - { title: Hand stories to Engineering, detail: Each story goes on with your Design handoff., where: Approvals }
    leadsWith: [Items in Design, Decisions awaiting you, Design handoffs waiting]
    agent: rhea-voss
    agents: Rhea Voss · solution architecture and decisions
    tools: [Jira Cloud, Enterprise Knowledge Repository]
    home: /
    firstWeek: []
  - key: functional-analyst
    name: Functional Analyst
    initials: FA
    layout: functional-analyst
    blurb: Write the interface and technical requirements, and shape the stories.
    promise: Agents draft the functional analysis and the stories; you make each interface whole.
    tasks:
      - { title: Write the functional analysis, detail: Interface and technical requirements for each impacted system., where: Design }
      - { title: Shape the stories, detail: 'Split, merge and finish the stories that build a feature.', where: Design }
      - { title: Close the gaps, detail: An interface with one side missing holds the Design handoff., where: Design }
    leadsWith: [Interfaces with one side missing, Stories to finish, Items in Design]
    agents: Analyst agents · functional analysis and stories
    tools: [Jira Cloud, Confluence]
    home: /
    firstWeek: []
  - key: application-architect
    name: Application Architect
    initials: AA
    layout: application-architect
    blurb: Own each system's application architecture, drawn from its code, and sign off Engineering.
    promise: An agent reads the code and drafts the application flow and objects; you accept it before anything is built.
    tasks:
      - { title: Accept the application architecture, detail: 'Application flow, objects and NFRs per component, from the code.', where: Engineering }
      - { title: Sign off Engineering, detail: Nothing is built before your sign-off., where: Approvals }
      - { title: Watch for drift, detail: The picture is marked stale when the code moves., where: Engineering }
    leadsWith: [Stories in Engineer, Architecture to accept, Engineering sign-offs waiting]
    agents: Application architect agent · application flow and objects
    tools: [Bitbucket, Jira Cloud]
    home: /
    firstWeek: []
  - key: test-analyst
    name: Test analyst
    initials: TA
    layout: test-analyst
    blurb: Write the test analysis, then verify each pull request and give the Test approval.
    promise: The AI writes and runs the automated tests; you decide what must be tested and sign it off.
    tasks:
      - { title: Write the test analysis, detail: 'Test cases, automated testing requirements, integration and E2E tests.', where: Engineering }
      - { title: Verify pull requests, detail: Check the AI's test evidence and give the Test approval., where: 'Test, Approvals' }
      - { title: Close coverage gaps, detail: Every acceptance criterion needs a ready test case., where: Engineering }
    leadsWith: [Pull requests waiting on a Test approval, Test analysis to finish, Coverage gaps]
    agents: Test agent · test cases and automated tests
    tools: [Jira Cloud, Bitbucket]
    home: /
    firstWeek: []
  # Phase 19: the Security engineer (root product.md §3.5): threat models, findings and risks.
  - key: security-engineer
    name: Security engineer
    initials: SE
    layout: security-engineer
    blurb: Keep every item threat-modelled and every finding owned and fixed on time.
    promise: The security agent drafts each threat model from the container view and scans every pull request; you decide what is accepted.
    tasks:
      - { title: Accept threat models, detail: STRIDE per trust boundary; each mitigation a requirement or a quality attribute., where: Security · Threat models }
      - { title: Chase findings past their fix-by date, detail: 'Each has an owner; ask the Software Factory for a fix.', where: Security · Findings }
      - { title: Review risk acceptances before they end, detail: An accepted risk opens again when it expires., where: Security · Risk register }
    leadsWith: [Findings past or near fix-by, Threat models waiting, Risks ending soon]
    agent: rook-vale
    agents: Security agent · threat models and scans
    tools: [Microsoft Teams]
    home: /
    firstWeek: []
  # Phase 23: the SRE (root product.md §3.7): SLOs, incidents, post-incident reviews, outcome reviews.
  - key: sre
    name: SRE
    initials: SR
    layout: sre
    blurb: Keep what runs in production within its SLOs, and learn from every incident.
    promise: Alerts reach you in Teams; the SRE agent drafts each incident's timeline and review; you resolve and accept.
    tasks:
      - { title: Watch the error budgets, detail: Each item's quality attributes are SLOs once its first release is live., where: Operations · SLOs }
      - { title: Run and resolve incidents, detail: 'Declare one, or raise it from an alert; follow-ups become ideas or defects.', where: Operations · Incidents }
      - { title: Accept post-incident reviews, detail: An accepted review is written to Knowledge., where: Operations · Incidents }
    leadsWith: [SLOs burning their budget, Open incidents, Reviews to accept, Outcome reviews due]
    agent: pip-okafor
    agents: SRE agent · timelines and post-incident reviews
    tools: [Microsoft Teams]
    home: /
    firstWeek: []
  - key: developer
    name: Developer
    initials: DV
    layout: developer
    blurb: Review, steer and approve what agents build.
    promise: The Software Factory and engineering teammates write the code; you review, steer and merge.
    tasks:
      - { title: Review agent pull requests, detail: Agents open PRs; people merge., where: Software Factory }
      - { title: Steer runs that get stuck, detail: A stuck run asks you a question., where: Factory · Runs }
      - { title: Pair with engineering teammates, detail: Juno Park opens PRs on your repos. Juno never merges to main., where: Teammates }
    leadsWith: [PRs waiting for you, Runs on your repos, Runs that need help]
    agent: juno-park
    agents: Juno Park · implementation and tests
    tools: [GitHub, Jira Cloud]
    home: /
    firstWeek:
      - { key: review-first-pr, text: 'Give the Build approval on slots-api #482', short: First PR, next: review your first pull request, done: { type: approval.decided, where: { type: build-approval } } }
      - { key: answer-a-run, text: Answer a question from a stuck run, short: Steer a run, next: steer a stuck run, done: { type: run.answered } }
      - { key: pair-with-juno, text: Hand a ticket to Juno Park, short: Pair with Juno, next: hand a ticket to a teammate, done: { type: teammate.task_started, where: { teammateId: juno-park } } }
  - key: designer
    name: Designer
    initials: DS
    blurb: Journeys, flows and screens built from the design system.
    promise: Agents draft journeys and screens; you set the direction and hand off.
    tasks:
      - { title: Shape journeys and flows, detail: Agents draft journey maps and user flows from the spec., where: UX Design }
      - { title: Approve screens, detail: Screens are built from design-system components., where: UI Design }
      - { title: Hand screens to Design, detail: 'The Product handoff takes the spec, journeys and screens to Design.', where: Approvals }
    leadsWith: [Flows waiting on you, Screens to approve, Handoffs]
    agents: Design agents · journeys, flows and screens
    tools: [Figma, Jira Cloud]
    home: /home/overview
    firstWeek:
      - { key: review-slot-journey, text: Review the slot-booking journey of PRD-031, short: First journey, next: review a journey, done: { type: ux.updated, where: { itemId: PRD-031 } } }
      - { key: approve-first-screen, text: Approve the slot picker screen, short: First screen, next: approve a screen, done: { type: ui.screen_updated, where: { itemId: PRD-031 } } }
      - { key: give-product-handoff, text: Join a Product handoff, short: Product handoff, next: join a Product handoff, done: { type: approval.decided, where: { type: spec } } }
  - key: engineering-lead
    name: Engineering lead
    initials: EL
    blurb: Flow, people, agents and budgets across your teams.
    promise: See where work waits, who is overloaded and what it costs.
    tasks:
      - { title: Unblock the line, detail: See which items wait too long and on whom., where: Lifecycle }
      - { title: Balance people and agents, detail: Teams mix people and agent teammates., where: Teams & roles }
      - { title: Watch cost and speed, detail: Lead time, approvals and spend per system., where: Metrics }
    leadsWith: [Where work waits, Who is overloaded, What it costs]
    agents: Every agent teammate on your teams
    tools: [Jira Cloud, GitHub]
    home: /home/overview
    firstWeek:
      - { key: unblock-an-item, text: Nudge the item that has waited longest, short: Unblock, next: unblock an item, done: { type: item.nudged } }
      - { key: balance-a-team, text: Check who is on the Delivery squad, short: Your teams, next: look at your teams, done: { type: profile.updated } }
      - { key: decide-a-gate, text: Decide an approval waiting on you, short: First decision, next: decide an approval, done: { type: approval.decided } }
  - key: platform-engineer
    name: Platform engineer
    initials: PE
    blurb: Repos, sandboxes, models and guardrails.
    promise: Keep the factory floor safe, fast and affordable.
    tasks:
      - { title: Grant repo access, detail: Agents can only touch what is granted here., where: Repositories }
      - { title: Run the sandboxes, detail: Every agent works in its own sandbox., where: Containers }
      - { title: Set guardrails, detail: Models, budgets and guardrails for every system., where: Settings }
    leadsWith: [Repositories and agent access, Containers, Model spend]
    agents: Every agent teammate's sandbox
    tools: [GitHub, Azure]
    home: /platform/repositories
    firstWeek:
      - { key: grant-repo-access, text: Grant agent access to a repository, short: Repo access, next: grant repo access, done: { type: repo.access_changed } }
      - { key: check-a-budget, text: Set a budget in Platform · Settings, short: Budgets, next: set a budget, done: { type: budget.changed } }
      - { key: review-a-guardrail, text: Review a guardrail, short: Guardrails, next: review a guardrail, done: { type: guardrail.changed } }
