# A teammate speaking in the chat: its introduction, or a reply with no card. There is one NooblyJS bot (tech.md §7.3),
# so the card's header carries the teammate's name and the "NooblyJS teammate" label. Data: id, initials, name, text.
type: AdaptiveCard
$schema: http://adaptivecards.io/schemas/adaptive-card.json
version: "1.5"
body:
  - type: ColumnSet
    columns:
      - type: Column
        width: auto
        verticalContentAlignment: Center
        items:
          - { type: TextBlock, id: "avatar-{id}", text: "{initials}", weight: Bolder }
      - type: Column
        width: stretch
        items:
          - { type: TextBlock, text: "{name}", weight: Bolder, wrap: true }
          - { type: TextBlock, text: NooblyJS teammate, isSubtle: true, size: Small, spacing: None }
  - { type: TextBlock, text: "{text}", wrap: true }
