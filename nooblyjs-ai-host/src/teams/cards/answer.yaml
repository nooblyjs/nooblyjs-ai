# A teammate's answer (mockup noobly-teams-bot-answers-in-the-chat-html): what it says, the key facts, a primary action
# that opens NooblyJS, a secondary action, the sources and what the answer cost. Data: id, initials, name, text, title,
# rows[] { label, value }, primary { label, url }, secondary { label, url } (optional), footer.
#
# Both actions are links into NooblyJS. "Ask Thabo to decide" opens the approval; nothing is decided in Teams.
type: AdaptiveCard
$schema: http://adaptivecards.io/schemas/adaptive-card.json
version: "1.5"
body:
  - type: ColumnSet
    columns:
      - type: Column
        width: auto
        verticalContentAlignment: Center
        items:
          - { type: TextBlock, id: "avatar-{id}", text: "{initials}", weight: Bolder }
      - type: Column
        width: stretch
        items:
          - { type: TextBlock, text: "{name}", weight: Bolder, wrap: true }
          - { type: TextBlock, text: NooblyJS teammate, isSubtle: true, size: Small, spacing: None }
  - { type: TextBlock, text: "{text}", wrap: true }
  - $if: rows
    type: Container
    style: emphasis
    items:
      - { type: TextBlock, text: "{title}", weight: Bolder, wrap: true }
      - type: FactSet
        facts:
          - $each: rows
            $do: { title: "{label}", value: "{value}" }
      - type: ActionSet
        actions:
          - { type: Action.OpenUrl, title: "{primary.label}", url: "{primary.url}", style: positive }
          - $if: secondary
            type: Action.OpenUrl
            title: "{secondary.label}"
            url: "{secondary.url}"
  - { type: TextBlock, text: "{footer}", isSubtle: true, size: Small, wrap: true }
